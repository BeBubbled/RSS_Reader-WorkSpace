name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest
      - name: Test and build frontend
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run test:run
          pnpm run build

  image-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker buildx build --platform ${{ matrix.platform }} --load -t rss-ai-api:ci ./backend
      - name: Build web image
        run: docker buildx build --platform ${{ matrix.platform }} --load -t rss-ai-web:ci ./frontend
      - name: Start API image and check process health
        run: |
          docker run -d --name rss-ai-api-ci --platform ${{ matrix.platform }} -p 8000:8000 rss-ai-api:ci
          for attempt in $(seq 1 20); do curl --fail http://localhost:8000/health && exit 0; sleep 3; done
          docker logs rss-ai-api-ci
          exit 1
      - name: Stop API image
        if: always()
        run: docker rm -f rss-ai-api-ci || true

  compose-smoke-test:
    needs: [test, image-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment settings
        run: cp .env.example .env
      - name: Verify Compose topology
        run: |
          docker compose config
          docker compose config --format json | jq -e '(.services.postgres.ports // []) | length == 0'
          docker compose config --format json | jq -e '(.services.redis.ports // []) | length == 0'
      - name: Start stack and wait for health checks
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 36); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q reverse-proxy))" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Check proxy and authentication
        run: |
          curl --fail http://localhost:8080/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/app/status)" = "401"
          curl --fail --cookie-jar cookies.txt --header 'Content-Type: application/json' --data '{"username":"admin","password":"change-this-before-deploying"}' http://localhost:8080/api/auth/login
          curl --fail --cookie cookies.txt http://localhost:8080/api/auth/me
      - name: Stop stack
        if: always()
        run: docker compose down -v
