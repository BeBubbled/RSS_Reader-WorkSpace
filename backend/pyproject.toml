[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-ai-backend"
version = "0.1.0"
description = "RSS-AI Phase 0 backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "bleach>=6.2,<7",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
